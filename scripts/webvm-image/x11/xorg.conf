# CheerpX exposes a DRM/KMS device (/dev/dri/card0, "CheerpX KMS"), not a
# framebuffer: there is no /dev/fb0, so this is modesetting, not fbdev.
Section "Device"
    Identifier "kms"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
    # No GL in the guest: glamor would only try (and fail) to load Mesa drivers.
    Option     "AccelMethod" "none"
EndSection

Section "Module"
    Disable "glx"
EndSection

# No udev in the guest, so nothing hotplugs input. CheerpX feeds canvas mouse
# and keyboard through these two evdev nodes (seen by the probe in
# scripts/x11-test); evdev works out per device which one is which.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

Section "InputDevice"
    Identifier "event0"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "event1"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier  "layout"
    Screen      "screen"
    InputDevice "event0"
    InputDevice "event1"
EndSection

Section "Screen"
    Identifier "screen"
    Device     "kms"
EndSection
